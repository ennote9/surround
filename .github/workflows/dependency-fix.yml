name: Dependency Lock Refresh

on:
  push:
    branches: [qa-dependency-audit-20260920]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: qa-dependency-audit-20260920

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile and apply safe audit fixes
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh dependency lockfile and apply audit fixes"
          git push origin HEAD:qa-dependency-audit-20260920
